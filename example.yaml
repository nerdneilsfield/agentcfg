# Canonical agentcfg.yaml example (IR version 1).
#
# Scalar credentials are quoted strings:
#   "literal"                  constant, copied into generated output
#   "ENV:NAME"                 environment reference (never resolved here)
#   "Bearer ENV:NAME"          Authorization header only
#
# auth_type is optional and overrides the credential header the protocol sends
# by default. Omit it unless the upstream disagrees with the wire shape:
#   auth_type: bearer          Authorization: Bearer <credential>
#   auth_type: x-api-key       x-api-key: <credential> (anthropic-messages only)
#   auth_type: none            no credential at all
# It is not set below because only pi, prime-agent, and omp map it so far, and
# this file's default targets (crush, gajae) reject anything but "official".
#
# Copy this file:
#   agentcfg gen-example -o agentcfg.yaml
# Then compile:
#   agentcfg validate --config agentcfg.yaml
#   agentcfg gen --config agentcfg.yaml
#
# Field reference: docs/protocol.md
# Per-CLI mapping: docs/agents/

version: 1

providers:
  # One route, one protocol. A gateway that also speaks Anthropic is a
  # second provider (see anthropic-internal below).
  - id: volcengine
    name: Volcengine
    protocol: openai-completions
    base_url: https://example.com/v1
    api_key: "ENV:VOLC_API_KEY"
    headers:
      X-Tenant: "engineering"
      X-Gateway-Key: "ENV:GATEWAY_KEY"
    models:
      - id: glm-5.3
        name: GLM-5.3
        context_window: 128000
        max_output_tokens: 8192
        input: [text, image]
        output: [text]
        reasoning: true
        # Selectable efforts for this model. Not a default, not extra model ids.
        # Crush keeps every name. Gajae skips ultra (native ladder ends at max).
        variants: [low, medium, high, xhigh, max, ultra]
        tool_calling: true

  - id: anthropic-internal
    name: Anthropic Internal
    protocol: anthropic-messages
    base_url: https://anthropic-internal.example.com
    api_key: "ENV:ANTHROPIC_INTERNAL_TOKEN"
    models:
      - id: claude-internal
        name: Claude Internal
        context_window: 200000
        max_output_tokens: 64000
        input: [text, image]
        output: [text]
        reasoning: true

mcp:
  # command is an argv array. cwd and timeout_ms are optional; omit them
  # unless every selected target can represent them (Crush has no cwd).
  - id: context7
    transport: stdio
    command: [npx, -y, "@upstash/context7-mcp"]
    env:
      CONTEXT7_API_KEY: "ENV:CONTEXT7_API_KEY"

  # Bearer ENV:NAME is valid only on Authorization.
  - id: github
    transport: http
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization: "Bearer ENV:GITHUB_TOKEN"

defaults:
  model: volcengine/glm-5.3

# Default selection when --to is omitted. Not a wildcard: targets: [all]
# is an unknown id. Override with --to crush or --to all.
targets: [crush, gajae]
