# GoReleaser v2 configuration for agentcfg.
# Verify with: goreleaser check
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: agentcfg
    main: ./cmd/agentcfg
    binary: agentcfg
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X agentcfg/internal/buildinfo.Version={{.Version}}
      - -X agentcfg/internal/buildinfo.Commit={{.Commit}}
      - -X agentcfg/internal/buildinfo.Date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Publish to the nerdneilsfield/homebrew-apps tap and Scoop bucket.
homebrew_casks:
  - name: agentcfg
    homepage: https://github.com/nerdneilsfield/agentcfg
    description: Generate Codex and OpenCode configs from one provider and MCP source
    binaries:
      - agentcfg
    directory: Casks
    repository:
      owner: nerdneilsfield
      name: homebrew-apps
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/agentcfg"]
          end

scoops:
  - name: agentcfg
    homepage: https://github.com/nerdneilsfield/agentcfg
    description: Generate Codex and OpenCode configs from one provider and MCP source
    license: MIT
    directory: bucket
    repository:
      owner: nerdneilsfield
      name: homebrew-apps
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
