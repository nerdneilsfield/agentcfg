# GoReleaser v2 configuration for agentcfg.
# Verify with: goreleaser check
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: agentcfg
    main: ./cmd/agentcfg
    binary: agentcfg
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X agentcfg/internal/buildinfo.Version={{.Version}}
      - -X agentcfg/internal/buildinfo.Commit={{.Commit}}
      - -X agentcfg/internal/buildinfo.Date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
